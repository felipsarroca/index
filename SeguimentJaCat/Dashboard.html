<!doctype html>
<html lang="ca">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>Seguiment de ja.cat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--ink:#141826;--muted:#6b7286;--faint:#a3a9b8;--line:#e7eaf2;--soft:#eef1f7;--accent:#3b6cf6;--radius:18px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:56px}
    button,input{font:inherit;color:inherit}
    button{border:0;background:none;cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9db5fb;outline-offset:2px}
    h1,h2,p{margin:0}
    [hidden]{display:none!important}
    .shell{max-width:1400px;margin:auto;padding:22px clamp(16px,3vw,36px) 40px}

    .top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
    .back{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:17px}
    .back:hover{color:var(--accent)}
    h1{font-size:clamp(21px,2.4vw,27px);font-weight:800;letter-spacing:-.6px;margin-right:auto}
    .stamp{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
    .icon-btn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:17px}
    .icon-btn:hover{color:var(--accent)}
    .icon-btn:disabled{opacity:.4;cursor:default}
    .icon-btn.spin{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .status{padding:13px 16px;border-radius:12px;background:#eaf0ff;color:#2a4fc0;margin-bottom:16px;font-weight:500}
    .status.error{background:#fdecef;color:#b42345}

    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
    .kpi{background:var(--card);border-radius:var(--radius);padding:18px 20px 16px;border:1px solid var(--line);position:relative;overflow:hidden;min-width:0}
    .kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
    .kpi span{display:block;color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
    .kpi strong{display:block;font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-1.2px;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .kpi strong.name{font-size:clamp(19px,2vw,25px);letter-spacing:-.5px;margin-top:10px}
    .kpi em{font-style:normal;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

    .controls{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 12px;margin:0 0 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius)}
    .seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px}
    .seg button{padding:6px 11px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
    .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,24,38,.12)}
    .dates{display:inline-flex;align-items:center;gap:6px;color:var(--faint)}
    .dates input{border:1px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--card);font-size:13px;color:var(--ink)}
    .sep{width:1px;align-self:stretch;background:var(--line)}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--ink)}
    .chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
    .chip[aria-pressed="false"]{color:var(--faint);background:transparent}
    .chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 2px var(--faint)}
    .chip.app{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 35%,#fff)}
    .chip.app b{font-weight:400;color:var(--muted);margin-left:2px}
    .picker{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 auto;min-width:240px}
    .picker .chips{display:contents}
    .picker input{flex:1;min-width:150px;max-width:240px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);font-size:13px}
    .text-btn{padding:6px 9px;border-radius:9px;color:var(--accent);font-size:13px;font-weight:600}
    .text-btn:hover{background:#eaf0ff}

    .grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
    .wide{grid-column:1/-1}
    .stack{display:grid;gap:14px}
    .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px 18px 10px;min-width:0}
    .card header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:4px}
    .card h2{font-size:16px;font-weight:700;letter-spacing:-.2px;margin-right:auto}
    .chart{width:100%;height:320px}
    .chart.tall{height:390px}
    .chart.compact{height:84px!important}

    .felip-app-footer{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:8px;padding:7px clamp(15px,3vw,38px);background:rgba(244,246,251,.95);border-top:1px solid var(--line);backdrop-filter:blur(10px);font-size:10px;line-height:1.35;color:var(--muted)}
    .felip-app-footer img{width:71px;height:auto;display:block}
    .felip-app-footer a{text-decoration:none;color:inherit;font-weight:600}

    @media(max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.sep{display:none}}
    @media(max-width:560px){.stamp{display:none}.chart.tall{height:320px}.controls{position:static}.felip-app-footer{font-size:9px}.felip-app-footer img{width:60px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <a class="back" href="https://ja.cat/felipsarroca" title="Tornar a les aplicacions" aria-label="Tornar a les aplicacions">←</a>
      <h1>Seguiment de ja.cat</h1>
      <span class="stamp" id="stamp"></span>
      <button class="icon-btn" id="refresh" type="button" title="Actualitza les dades" aria-label="Actualitza les dades">↻</button>
    </header>
    <div class="status" id="status" role="status">Carregant…</div>

    <section class="kpis" aria-label="Resum">
      <article class="kpi" style="--c:#3b6cf6"><span>Clics</span><strong id="kTotal">—</strong></article>
      <article class="kpi" style="--c:#10a37f"><span>Clics nous</span><strong id="kNew">—</strong></article>
      <article class="kpi" style="--c:#f08c2e"><span>Apps</span><strong id="kApps">—</strong></article>
      <article class="kpi" style="--c:#9b5de5"><span>Més visitada</span><strong class="name" id="kTop">—</strong><em id="kTopN"></em></article>
    </section>

    <section class="controls" aria-label="Filtres">
      <div class="seg" id="period" role="group" aria-label="Període">
        <button type="button" data-v="all" aria-pressed="true">Tot</button>
        <button type="button" data-v="7" aria-pressed="false">7 d</button>
        <button type="button" data-v="30" aria-pressed="false">30 d</button>
        <button type="button" data-v="90" aria-pressed="false">90 d</button>
        <button type="button" data-v="365" aria-pressed="false">1 any</button>
      </div>
      <div class="dates"><input type="date" id="from" aria-label="Des de">–<input type="date" id="to" aria-label="Fins a"></div>
      <span class="sep"></span>
      <div class="chips" id="cats" role="group" aria-label="Categories"></div>
      <span class="sep"></span>
      <div class="picker">
        <input id="appSearch" list="appList" placeholder="Compara apps…" aria-label="Afegeix una app a la comparació" autocomplete="off">
        <datalist id="appList"></datalist>
        <div class="chips" id="selected"></div>
        <button type="button" class="text-btn" id="top5">Top 5</button>
        <button type="button" class="text-btn" id="clear" hidden>Treu-les</button>
      </div>
    </section>

    <section class="grid">
      <article class="card wide">
        <header>
          <h2>Evolució</h2>
          <div class="seg" id="metric" role="group" aria-label="Mesura">
            <button type="button" data-v="total" aria-pressed="true">Acumulats</button>
            <button type="button" data-v="new" aria-pressed="false">Nous</button>
          </div>
          <div class="seg" id="group" role="group" aria-label="Agrupació">
            <button type="button" data-v="day" aria-pressed="true">Captura</button>
            <button type="button" data-v="week" aria-pressed="false">Setmana</button>
            <button type="button" data-v="month" aria-pressed="false">Mes</button>
          </div>
        </header>
        <div class="chart tall" id="cEvo"></div>
      </article>
      <article class="card">
        <header><h2>Clics per app</h2></header>
        <div class="chart" id="cRank"></div>
      </article>
      <div class="stack">
        <article class="card"><header><h2>Per categoria</h2></header><div class="chart" id="cCat"></div></article>
        <article class="card"><header><h2>Més creixement</h2></header><div class="chart" id="cGrow"></div></article>
      </div>
    </section>
  </main>

    const LINES=['#3b6cf6','#f08c2e','#10a37f','#e05780','#9b5de5','#0fb5c9','#d4a20a','#5b6378'];
    const MAX_APPS=LINES.length;
    const INK='#141826',MUTED='#6b7286',FAINT='#a3a9b8',GRID='#eceff5';
    const state={dates:[],links:[],from:'',to:'',preset:'all',group:'day',metric:'total',cats:new Set(CATS.map(c=>c.id)),selected:[],rankNames:[]};
    const charts={};

    // Dates i agrupacions
    const day=(d,long)=>new Intl.DateTimeFormat('ca-ES',{day:'numeric',month:long?'long':'short',year:long?'numeric':undefined,timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
    const shift=(d,days)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()-days);return x.toISOString().slice(0,10)};
    function bucketKey(d){
      if(state.group==='month')return d.slice(0,7);
      if(state.group==='week'){const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()-(x.getUTCDay()+6)%7);return x.toISOString().slice(0,10)}
      return d;
    }
    function bucketLabel(k){
      if(state.group==='month')return new Intl.DateTimeFormat('ca-ES',{month:'short',year:'2-digit',timeZone:'UTC'}).format(new Date(k+'-15T12:00:00Z'));
      return day(k);
    }
    function buckets(){
      const map=new Map();
      state.dates.filter(d=>d>=state.from&&d<=state.to).forEach(d=>{
        const k=bucketKey(d);
        if(!map.has(k))map.set(k,{label:bucketLabel(k),dates:[]});
        map.get(k).dates.push(d);
      });
      return [...map.values()];
    }

    // Dades: cada enllaç guarda les observacions i les diferències positives entre captures
    function categoryOf(url){
      const u=String(url||'').toLowerCase();
      if(/\/edu-apps(\/|$)/.test(u))return 'edu';
      if(/\/util-apps(\/|$)/.test(u))return 'util';
      if(/\/jocs(\/|$)/.test(u))return 'jocs';
      if(/github\.io\/web(\/|$)/.test(u))return 'web';
      return 'altres';
    }
    function prepare(raw){
      const idx=(raw.dates||[]).map((d,i)=>({d,i})).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.d)).sort((a,b)=>a.d.localeCompare(b.d));
      state.dates=idx.map(x=>x.d);
      state.links=(raw.links||[]).map(l=>{
        const obs=idx.map(x=>({d:x.d,v:l.snapshots[x.i]})).filter(o=>o.v!==null&&o.v!==''&&Number.isFinite(Number(o.v))).map(o=>({d:o.d,v:Number(o.v)}));
        const deltas=[];
        for(let i=1;i<obs.length;i++){const dv=obs[i].v-obs[i-1].v;if(dv>=0)deltas.push({d:obs[i].d,v:dv})}
        return {app:l.app,cat:categoryOf(l.destination),obs,deltas};
      });
    }
    function valueAt(link,d){let v=null;for(const o of link.obs){if(o.d>d)break;v=o.v}return v}
    const inPeriod=d=>d>state.from&&d<=state.to;
    function appsSummary(links){
      const map=new Map();
      links.forEach(l=>{
        const t=valueAt(l,state.to);
        if(t===null)return;
        let a=map.get(l.app);
        if(!a){a={app:l.app,cat:l.cat,total:0,growth:0,measured:false};map.set(l.app,a)}
        a.total+=t;
        l.deltas.forEach(x=>{if(inPeriod(x.d)){a.growth+=x.v;a.measured=true}});
      });
      return [...map.values()].sort((a,b)=>b.total-a.total||a.app.localeCompare(b.app,'ca'));
    }
    const visibleLinks=()=>state.links.filter(l=>state.cats.has(l.cat));

    // Gràfics
    const axisLabel={color:MUTED,fontSize:12,fontFamily:'Inter'};
    const tooltipBase={backgroundColor:'#fff',borderColor:GRID,borderWidth:1,padding:[10,12],textStyle:{color:INK,fontFamily:'Inter',fontSize:13},extraCssText:'border-radius:12px;box-shadow:0 8px 24px rgba(20,24,38,.12)'};
    const dot=c=>'<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+c+';margin-right:7px"></span>';
    function fit(chart,el,compact){el.classList.toggle('compact',compact);chart.resize()}
    function message(chart,text){
      chart.setOption({title:{text,left:'center',top:'middle',textStyle:{color:FAINT,fontSize:14,fontWeight:500,fontFamily:'Inter'}},series:[]},true);
    }
    function sumTotal(links,b){
      const last=b.dates[b.dates.length-1];let s=0,known=false;
      links.forEach(l=>{const v=valueAt(l,last);if(v!==null){s+=v;known=true}});
      return known?s:null;
    }
    function sumNew(links,b){
      let s=0,known=false;
      links.forEach(l=>l.deltas.forEach(x=>{if(inPeriod(x.d)&&b.dates.includes(x.d)){s+=x.v;known=true}}));
      return known?s:null;
    }

    function renderEvo(){
      const chart=charts.evo;let bs=buckets();const isNew=state.metric==='new',sel=state.selected.length>0;
      const groups=sel
        ?state.selected.map((name,i)=>({name,color:LINES[i%LINES.length],links:state.links.filter(l=>l.app===name)}))
        :CATS.filter(c=>state.cats.has(c.id)).map(c=>({name:c.name,color:c.color,links:state.links.filter(l=>l.cat===c.id)})).filter(g=>g.links.length);
      let data=groups.map(g=>bs.map(b=>isNew?sumNew(g.links,b):sumTotal(g.links,b)));
      if(isNew){
        const keep=bs.map((_,j)=>data.some(r=>r[j]!==null));
        bs=bs.filter((_,j)=>keep[j]);data=data.map(r=>r.filter((_,j)=>keep[j]));
      }
      const enough=isNew?bs.length>0:bs.length>1;
      fit(chart,$('cEvo'),!enough);
      if(!enough){message(chart,state.dates.length<2?'Cal una segona captura per veure l’evolució':'Amplia el període per veure l’evolució');return}
      const many=bs.length>36;
      chart.setOption({
        color:groups.map(g=>g.color),
        legend:{type:'scroll',top:0,left:0,right:0,icon:'roundRect',pageIconColor:MUTED,pageTextStyle:{color:MUTED},itemWidth:12,itemHeight:12,itemGap:16,textStyle:{color:INK,fontSize:13,fontFamily:'Inter'}},
        grid:{left:8,right:sel&&!isNew?150:28,top:40,bottom:many?52:8,containLabel:true},
        tooltip:{...tooltipBase,trigger:'axis',axisPointer:{type:isNew?'shadow':'line',lineStyle:{color:FAINT}},formatter:ps=>{
          const rows=ps.filter(p=>p.value!==null&&p.value!==undefined).sort((a,b)=>b.value-a.value);
          const total=rows.reduce((s,p)=>s+p.value,0);
          return '<b>'+esc(ps[0].axisValue)+'</b><br>'+rows.map(p=>dot(p.color)+esc(p.seriesName)+'<b style="float:right;margin-left:24px">'+(isNew?'+':'')+fmt(p.value)+'</b>').join('<br>')+(!sel&&rows.length>1?'<div style="border-top:1px solid '+GRID+';margin-top:6px;padding-top:6px">Total<b style="float:right">'+(isNew?'+':'')+fmt(total)+'</b></div>':'');
        }},
        xAxis:{type:'category',data:bs.map(b=>b.label),boundaryGap:isNew,axisLine:{lineStyle:{color:GRID}},axisTick:{show:false},axisLabel},
        yAxis:{type:'value',splitLine:{lineStyle:{color:GRID,type:'dashed'}},axisLabel:{...axisLabel,formatter:v=>fmt(v)}},
        dataZoom:many?[{type:'slider',bottom:8,height:22,borderColor:GRID,fillerColor:'rgba(59,108,246,.12)',textStyle:{color:MUTED}}]:[],
        series:groups.map((g,i)=>isNew
          ?{name:g.name,type:'bar',stack:sel?undefined:'all',data:data[i],barMaxWidth:sel?18:36,itemStyle:{borderRadius:sel?[4,4,0,0]:0}}
          :sel
            ?{name:g.name,type:'line',data:data[i],connectNulls:true,smooth:.2,symbol:'circle',symbolSize:bs.length>40?0:7,lineStyle:{width:3},emphasis:{focus:'series'},endLabel:{show:true,formatter:p=>p.seriesName+'  '+fmt(p.value),color:g.color,fontWeight:700,fontFamily:'Inter'},labelLayout:{moveOverlap:'shiftY'}}
            :{name:g.name,type:'line',stack:'all',data:data[i],connectNulls:true,smooth:.2,symbol:'none',lineStyle:{width:1.5},areaStyle:{opacity:.85},emphasis:{focus:'series'}}
        )
      },true);
    }

    function renderRank(list){
      const chart=charts.rank,el=$('cRank');
      state.rankNames=list.map(a=>a.app);
      el.style.height=Math.max(260,list.length*25+36)+'px';
      chart.resize();
      if(!list.length){message(chart,'No hi ha dades en aquest període');return}
      const measured=list.some(a=>a.measured),sel=new Set(state.selected);
      const item=(a,v,alpha)=>({value:v,itemStyle:{color:CAT[a.cat].color,opacity:(sel.size&&!sel.has(a.app)?.22:1)*alpha}});
      const label={show:true,position:'right',distance:6,formatter:p=>{const a=list[p.dataIndex];return '{t|'+fmt(a.total)+'}'+(a.growth?' {g|+'+fmt(a.growth)+'}':'')},rich:{t:{color:INK,fontWeight:700,fontSize:12,fontFamily:'Inter'},g:{color:'#10a37f',fontWeight:700,fontSize:12,fontFamily:'Inter'}}};
      const bar={type:'bar',stack:'t',barWidth:15,cursor:'pointer'};
      chart.setOption({
        grid:{left:4,right:78,top:4,bottom:4,containLabel:true},
        tooltip:{...tooltipBase,trigger:'axis',axisPointer:{type:'shadow',shadowStyle:{color:'rgba(20,24,38,.04)'}},formatter:ps=>{
          const a=list[ps[0].dataIndex];
          return dot(CAT[a.cat].color)+'<b>'+esc(a.app)+'</b><br>'+fmt(a.total)+' clics'+(a.measured?'<br><span style="color:#10a37f;font-weight:600">+'+fmt(a.growth)+' nous</span>':'');
        }},
        xAxis:{type:'value',splitLine:{lineStyle:{color:GRID,type:'dashed'}},axisLabel:{...axisLabel,formatter:v=>fmt(v)}},
        yAxis:{type:'category',data:state.rankNames,inverse:true,axisLine:{show:false},axisTick:{show:false},axisLabel:{color:INK,fontSize:12.5,fontFamily:'Inter',width:170,overflow:'truncate'}},
        series:measured
          ?[{...bar,name:'Abans',data:list.map(a=>item(a,a.total-a.growth,.38))},{...bar,name:'Nous',data:list.map(a=>item(a,a.growth,1)),itemStyle:{borderRadius:[0,5,5,0]},label}]
          :[{...bar,name:'Clics',data:list.map(a=>item(a,a.total,1)),itemStyle:{borderRadius:[0,5,5,0]},label}]
      },true);
    }

    function renderCats(list){
      const chart=charts.cat,total=list.reduce((s,a)=>s+a.total,0);
      const data=CATS.filter(c=>state.cats.has(c.id)).map(c=>({name:c.name,id:c.id,value:list.filter(a=>a.cat===c.id).reduce((s,a)=>s+a.total,0),itemStyle:{color:c.color}})).filter(d=>d.value>0);
      if(!total){message(chart,'Sense clics');return}
      chart.setOption({
        tooltip:{...tooltipBase,trigger:'item',formatter:p=>dot(p.color)+'<b>'+esc(p.name)+'</b><br>'+fmt(p.value)+' clics · '+Math.round(p.percent)+' %'},
        title:{text:fmt(total),subtext:'clics',left:'center',top:'40%',textStyle:{color:INK,fontSize:26,fontWeight:800,fontFamily:'Inter'},subtextStyle:{color:MUTED,fontSize:12,fontFamily:'Inter'},itemGap:2},
        series:[{type:'pie',radius:['50%','72%'],center:['50%','50%'],avoidLabelOverlap:true,cursor:'pointer',itemStyle:{borderColor:'#fff',borderWidth:3,borderRadius:6},
          label:{overflow:'none',formatter:p=>'{n|'+p.name+'}\n{p|'+Math.round(p.percent)+' %}',rich:{n:{color:MUTED,fontSize:12,fontFamily:'Inter'},p:{color:INK,fontSize:14,fontWeight:800,fontFamily:'Inter',lineHeight:20}}},
          labelLine:{length:8,length2:8,lineStyle:{color:FAINT}},data}]
      },true);
    }

    function renderGrowth(list){
      const chart=charts.grow,top=list.filter(a=>a.growth>0).sort((a,b)=>b.growth-a.growth).slice(0,10);
      fit(chart,$('cGrow'),!top.length);
      if(!top.length){message(chart,state.dates.length<2?'Cal una segona captura':'Cap clic nou en aquest període');return}
      chart.setOption({
        grid:{left:4,right:52,top:4,bottom:4,containLabel:true},
        tooltip:{...tooltipBase,trigger:'item',formatter:p=>dot(p.color)+'<b>'+esc(p.name)+'</b><br>+'+fmt(p.value)+' clics nous'},
        xAxis:{type:'value',show:false},
        yAxis:{type:'category',data:top.map(a=>a.app),inverse:true,axisLine:{show:false},axisTick:{show:false},axisLabel:{color:INK,fontSize:12.5,fontFamily:'Inter',width:130,overflow:'truncate'}},
        series:[{type:'bar',barWidth:14,data:top.map(a=>({value:a.growth,itemStyle:{color:CAT[a.cat].color,borderRadius:[0,5,5,0]}})),
          label:{show:true,position:'right',formatter:p=>'+'+fmt(p.value),color:'#10a37f',fontWeight:700,fontFamily:'Inter'}}]
      },true);
    }

    // Controls
    function press(groupId,value){$(groupId).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===value)))}
    function applyPreset(p){
      state.preset=p;
      const first=state.dates[0],last=state.dates[state.dates.length-1];
      state.to=last;
      state.from=p==='all'?first:(shift(last,+p)<first?first:shift(last,+p));
      $('from').value=state.from;$('to').value=state.to;
      press('period',p);
    }
    function renderCatChips(){
      $('cats').innerHTML=CATS.map(c=>'<button type="button" class="chip" style="--c:'+c.color+'" data-cat="'+c.id+'" aria-pressed="'+state.cats.has(c.id)+'"><i></i>'+c.name+'</button>').join('');
    }
    function renderSelected(){
      $('selected').innerHTML=state.selected.map((name,i)=>'<button type="button" class="chip app" style="--c:'+LINES[i%LINES.length]+'" data-app="'+esc(name)+'" title="Treu '+esc(name)+'"><i></i>'+esc(name)+'<b>×</b></button>').join('');
      $('clear').hidden=!state.selected.length;
      $('appSearch').disabled=state.selected.length>=MAX_APPS;
      const names=[...new Set(state.links.map(l=>l.app))].filter(n=>!state.selected.includes(n)).sort((a,b)=>a.localeCompare(b,'ca'));
      $('appList').innerHTML=names.map(n=>'<option value="'+esc(n)+'"></option>').join('');
    }
    function toggleApp(name){
      const i=state.selected.indexOf(name);
      if(i>=0)state.selected.splice(i,1);
      else if(state.selected.length<MAX_APPS)state.selected.push(name);
      render();
    }

    function render(){
      if(!state.dates.length)return;
      const list=appsSummary(visibleLinks()),measured=list.some(a=>a.measured);
      const total=list.reduce((s,a)=>s+a.total,0),growth=list.reduce((s,a)=>s+a.growth,0);
      $('kTotal').textContent=fmt(total);
      $('kNew').textContent=measured?'+'+fmt(growth):'—';
      $('kApps').textContent=fmt(list.length);
      $('kTop').textContent=list[0]?list[0].app:'—';
      $('kTop').title=list[0]?list[0].app:'';
      $('kTopN').textContent=list[0]?fmt(list[0].total)+' clics':'';
      renderCatChips();renderSelected();
      renderEvo();renderRank(list);renderCats(list);renderGrowth(list);
    }

    function setStatus(text,error){const s=$('status');s.hidden=!text;s.textContent=text||'';s.className='status'+(error?' error':'')}
    function load(){
      const btn=$('refresh');btn.disabled=true;btn.classList.add('spin');
      google.script.run.withSuccessHandler(raw=>{
        btn.disabled=false;btn.classList.remove('spin');
        prepare(raw||{});
        if(!state.dates.length){setStatus('Encara no hi ha captures a l’Historial.');return}
        setStatus('');
        const first=state.dates[0],last=state.dates[state.dates.length-1];
        ['from','to'].forEach(id=>{$(id).min=first;$(id).max=last});
        $('stamp').textContent=day(last,true)+' · '+state.dates.length+(state.dates.length===1?' captura':' captures');
        const keep=state.preset;
        state.selected=state.selected.filter(n=>state.links.some(l=>l.app===n));
        applyPreset(keep==='custom'?'all':keep);
        render();
      }).withFailureHandler(e=>{
        btn.disabled=false;btn.classList.remove('spin');
        setStatus('No s’han pogut carregar les dades. Torna-ho a provar amb ↻.',true);
        console.error(e);
      }).getDashboardData();
    }

    function init(){
      if(typeof echarts==='undefined'){setStatus('No s’ha pogut carregar la biblioteca de gràfics. Recarrega la pàgina.',true);return}
      [['evo','cEvo'],['rank','cRank'],['cat','cCat'],['grow','cGrow']].forEach(([k,id])=>{charts[k]=echarts.init($(id),null,{renderer:'canvas'})});
      charts.rank.on('click',p=>{const name=state.rankNames[p.dataIndex];if(name)toggleApp(name)});
      charts.cat.on('click',p=>{const id=p.data&&p.data.id;if(!id)return;state.cats=state.cats.size===1&&state.cats.has(id)?new Set(CATS.map(c=>c.id)):new Set([id]);render()});
      $('period').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b||!state.dates.length)return;applyPreset(b.dataset.v);render()});
      ['from','to'].forEach(id=>$(id).addEventListener('change',()=>{
        const f=$('from').value,t=$('to').value;
        if(!f||!t||f>t)return;
        state.from=f;state.to=t;state.preset='custom';press('period','custom');render();
      }));
      $('metric').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;state.metric=b.dataset.v;press('metric',state.metric);renderEvo()});
      $('group').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;state.group=b.dataset.v;press('group',state.group);renderEvo()});
      $('cats').addEventListener('click',e=>{
        const b=e.target.closest('[data-cat]');if(!b)return;
        const id=b.dataset.cat;
        state.cats.has(id)?state.cats.delete(id):state.cats.add(id);
        if(!state.cats.size)CATS.forEach(c=>state.cats.add(c.id));
        render();
      });
      $('selected').addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b)toggleApp(b.dataset.app)});
      $('appSearch').addEventListener('change',e=>{
        const v=e.target.value.trim(),name=[...new Set(state.links.map(l=>l.app))].find(n=>n.toLocaleLowerCase('ca')===v.toLocaleLowerCase('ca'));
        e.target.value='';
        if(name&&!state.selected.includes(name))toggleApp(name);
      });
      $('top5').addEventListener('click',()=>{state.selected=appsSummary(visibleLinks()).slice(0,5).map(a=>a.app);render()});
      $('clear').addEventListener('click',()=>{state.selected=[];render()});
      $('refresh').addEventListener('click',load);
      renderCatChips();
      let frame;
      window.addEventListener('resize',()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>Object.values(charts).forEach(c=>c.resize()))});
      load();
    }
    init();
  </script>
</body>
</html>
